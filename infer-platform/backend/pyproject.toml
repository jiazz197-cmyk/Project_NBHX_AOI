# ============================================================
# 平台 B 后端（infer-platform/backend）
#
# 依赖白名单：docs/contracts/平台B_接口与数据契约.md §1
# 目录结构：  docs/P0骨架设计_双平台.md §1
#
# 注意：共享包 skillname / pipeline-core 不在本文件声明依赖，
# 按 docs 约定用 editable 安装：
#   uv pip install -e ../../packages/skillname -e ../../packages/pipeline-core
# ============================================================

[project]
name = "aoi-infer"
version = "0.1.0"
description = "平台 B（推理检测平台）后端：单进程 FastAPI + SQLite + 本地磁盘"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "sqlalchemy",
    "onnxruntime",   # GPU 机器可替换为 "onnxruntime-gpu"
    "numpy",
    "pillow",
    "jinja2",
    "apscheduler",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
