[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillname"
version = "0.1.0"
description = "AOI skill vocabulary: task types, fault codes, model refs and image tags (zero third-party dependencies)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Platform A (AOI)" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["skillname*"]
