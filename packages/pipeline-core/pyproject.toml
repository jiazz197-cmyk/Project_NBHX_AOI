[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-core"
version = "0.1.0"
description = "AOI 推理内核：切片/NMS 合并/类别映射/三档判定/检测配置解析"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "skillname>=0.1.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["pipeline_core*"]